# Build the shaded mcMMO plugin and make it downloadable from Actions.
name: Build mcMMO JAR

on:
  push:
    branches:
      - '**'
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/maven.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/maven.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and upload mcMMO
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17 and cache Maven dependencies
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compile, test and package
        run: mvn --batch-mode --no-transfer-progress clean verify -DdisableXmlReport=true

      - name: Verify and stage runnable plugin
        shell: bash
        run: |
          set -euo pipefail
          test -s target/mcMMO.jar
          jar tf target/mcMMO.jar | grep -qx 'plugin.yml'
          jar tf target/mcMMO.jar | grep -qx 'com/gmail/nossr50/mcMMO.class'
          mkdir -p dist
          cp target/mcMMO.jar dist/mcMMO.jar
          (
            cd dist
            sha256sum mcMMO.jar > SHA256SUMS
          )
          echo "Plugin version:"
          unzip -p dist/mcMMO.jar plugin.yml | grep -m1 '^version:'
          echo "Artifact checksum:"
          cat dist/SHA256SUMS

      - name: Upload downloadable JAR
        uses: actions/upload-artifact@v4
        with:
          name: mcMMO-JAR
          path: |
            dist/mcMMO.jar
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
